<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380"
     role="img" aria-labelledby="svgTitle svgDesc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="svgTitle">High-mast retrofit: relocating the driver from the luminaire head to a ground-level control cabinet</title>
  <desc id="svgDesc">Diagram of a 30-metre high-mast luminaire. The LED driver and its cooling are moved out of the luminaire head into a ground-level power control cabinet, fed by a 30-metre DC run that must survive voltage drop, conductor heating and insulation limits.</desc>

  <polygon points="112,142 148,142 216,300 40,300" fill="#FAC775" opacity="0.35"/>

  <rect x="96" y="96" width="126" height="46" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="96" y="96" width="126" height="10" rx="5" fill="#BA7517"/>
  <rect x="152" y="142" width="16" height="158" fill="#D3D1C7"/>

  <rect x="0" y="300" width="680" height="80" fill="#F1EFE8"/>
  <line x1="0" y1="300" x2="680" y2="300" stroke="#B4B2A9" stroke-width="1"/>

  <path d="M 200 142 V 266 H 300" fill="none" stroke="#0F6E56" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>

  <line x1="262" y1="142" x2="262" y2="266" stroke="#888780" stroke-width="1"/>
  <line x1="256" y1="142" x2="268" y2="142" stroke="#888780" stroke-width="1"/>
  <line x1="256" y1="266" x2="268" y2="266" stroke="#888780" stroke-width="1"/>
  <text x="274" y="205" font-size="12" fill="#5F5E5A">30 m DC</text>
  <text x="274" y="221" font-size="12" fill="#5F5E5A">run</text>

  <rect x="300" y="226" width="132" height="74" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="254" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">Power control</text>
  <text x="366" y="274" font-size="12" fill="#0F6E56" text-anchor="middle">Cabinet + cooling</text>

  <circle cx="516" cy="264" r="9" fill="#888780"/>
  <rect x="509" y="275" width="14" height="25" rx="5" fill="#888780"/>
  <text x="534" y="284" font-size="13" fill="#2C2C2A">Service from the ground</text>

  <text x="40" y="80" font-size="14" font-weight="500" fill="#2C2C2A">Retrofit principle</text>
  <text x="40" y="108" font-size="13" fill="#2C2C2A">1. Driver and thermal parts stay in the head.</text>
  <text x="40" y="130" font-size="13" fill="#2C2C2A">2. They move into a cooled ground cabinet.</text>
  <text x="40" y="152" font-size="13" fill="#2C2C2A">3. The 30 m DC run must survive voltage drop,</text>
  <text x="40" y="174" font-size="13" fill="#2C2C2A">   heating and insulation limits — simulated first.</text>

  <rect x="28" y="198" width="2" height="16" fill="#0F6E56"/>
  <text x="40" y="211" font-size="13" fill="#0F6E56">Result: no work at height.</text>

  <text x="40" y="360" font-size="11" fill="#888780">Illustration, not a photograph — reporting basis: China Civil Aviation News, 2026-08-27.</text>
</svg>
