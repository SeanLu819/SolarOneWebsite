# Vercel Deployment Storage weekly cleanup.
#
# Why: every push to main produces TWO deployments (Preview + Production) and
# Vercel keeps them forever, so Deployment Storage (10 GB Hobby cap) fills up
# within weeks (hit 8.94/10 GB on 2026-10-01). This workflow deletes:
#   - Preview deployments older than 7 days
#   - Production deployments older than 30 days
# The CURRENTLY SERVING production deployment is protected by the Vercel API
# itself (it refuses with HTTP 400) and the script just skips it. Recent
# production history (< 30 days) stays available for rollback.
#
# Requires repo secret: VERCEL_TOKEN (Vercel account settings -> Tokens,
# scope = SolarOne team).
#
# Manual run: Actions tab -> "Cleanup old Vercel deployments" -> Run workflow.

name: Cleanup old Vercel deployments

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC (11:00 Beijing)
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old preview (7d) and production (30d) deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_NAME: SolarOne
          PROJECT: solar-one-website
          PREVIEW_KEEP_DAYS: 7
          PROD_KEEP_DAYS: 30
        run: |
          set -euo pipefail

          # Resolve the SolarOne team id (deployments live under the team,
          # so every API call below must pass teamId).
          TEAM_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams" \
            | jq -r --arg n "$TEAM_NAME" '.teams[] | select(.name == $n) | .id' | head -1)
          if [ -z "$TEAM_ID" ]; then
            echo "ERROR: team '$TEAM_NAME' not found for this token" >&2
            exit 1
          fi
          echo "team id: $TEAM_ID"

          delete_page() { # $1 = target (preview|production), $2 = until-ms
            local target="$1" until_ms="$2" ids code deleted_in_page
            local page_deleted=0 page_seen=0
            deleted_in_page=0

            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?app=$PROJECT&target=$target&limit=100&until=$until_ms&teamId=$TEAM_ID")
            IDS=$(echo "$RESP" | jq -r '.deployments[].uid')

            page_seen=$(echo "$IDS" | grep -c . || true)
            [ "$page_seen" -eq 0 ] && { echo "  nothing left"; return 1; }

            for id in $IDS; do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$id?teamId=$TEAM_ID")
              if [ "$code" = "200" ]; then
                echo "  deleted $id"
                deleted_in_page=$((deleted_in_page + 1))
              else
                # e.g. the currently serving production (HTTP 400) — skip it.
                echo "  skip $id (HTTP $code)"
              fi
            done

            # If every id on the page failed (e.g. only the live prod is
            # left in the window), stop so we never loop on the same page.
            [ "$deleted_in_page" -eq 0 ] && return 1
            return 0
          }

          total=0

          echo "== Phase 1: preview deployments older than $PREVIEW_KEEP_DAYS days =="
          PREV_CUTOFF=$(date -u -d "$PREVIEW_KEEP_DAYS days ago" +%s)000
          while delete_page preview "$PREV_CUTOFF"; do total=$((total + 1)); done || true

          echo "== Phase 2: production deployments older than $PROD_KEEP_DAYS days =="
          PROD_CUTOFF=$(date -u -d "$PROD_KEEP_DAYS days ago" +%s)000
          while delete_page production "$PROD_CUTOFF"; do total=$((total + 1)); done || true

          echo "cleanup done"
